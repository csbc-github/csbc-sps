<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PLY Align Editor</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #101114;
      color: #f4f4f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #101114;
    }

    #viewer {
      position: fixed;
      inset: 0;
    }

    .screen-guide {
      position: fixed;
      pointer-events: none;
      opacity: 0.45;
      background: #ffffff;
      z-index: 2;
    }

    .screen-guide.h {
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
    }

    .screen-guide.v {
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
    }

    .panel {
      position: fixed;
      left: 16px;
      top: 16px;
      width: min(420px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(20, 22, 25, 0.90);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.32);
      z-index: 3;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 650;
    }

    .group {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: #d8d9d6;
    }

    select,
    button,
    input[type="range"],
    input[type="number"] {
      width: 100%;
    }

    select,
    button,
    input[type="number"] {
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      background: #262a2f;
      color: #f7f7f4;
      font: inherit;
    }

    input[type="number"] {
      padding: 0 8px;
    }

    button {
      cursor: pointer;
      font-weight: 620;
    }

    button:hover { background: #30353b; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .triple {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
    }

    .stat {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: #e8e8e4;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .coord {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 10px;
      font-variant-numeric: tabular-nums;
    }

    .coord span:nth-child(odd) { color: #aeb7bd; }

    .bar {
      height: 6px;
      margin-top: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.10);
    }

    .bar > div {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #46d6a7, #d8cd54);
      transition: width 160ms ease;
    }
  </style>
</head>
<body>
  <canvas id="viewer"></canvas>
  <div class="screen-guide h"></div>
  <div class="screen-guide v"></div>

  <section class="panel">
    <h1>PLY 旋轉校正編輯器</h1>

    <div class="group">
      <label>
        檔案
        <select id="fileSelect">
          <option value="angle_steel.ply">angle_steel.ply</option>
          <option value="empty.ply">empty.ply</option>
          <option value="angle_steel_ground_roi_calibrated.ply">angle_steel_ground_roi_calibrated.ply</option>
          <option value="empty_ground_roi_calibrated.ply">empty_ground_roi_calibrated.ply</option>
          <option value="angle_steel_edge_auto_calibrated.ply">angle_steel_edge_auto_calibrated.ply</option>
          <option value="angle_steel_xy_aligned.ply">angle_steel_xy_aligned.ply</option>
          <option value="angle_steel_xy_aligned_ground_rotated.ply">angle_steel_xy_aligned_ground_rotated.ply</option>
          <option value="angle_steel_xy_aligned_four_edge_rotated_zeroed.ply">angle_steel_xy_aligned_four_edge_rotated_zeroed.ply</option>
          <option value="angle_steel_xy_aligned_z_flipped_grounded.ply">angle_steel_xy_aligned_z_flipped_grounded.ply</option>
          <option value="angle_steel_xy_ground_flipped.ply">angle_steel_xy_ground_flipped.ply</option>
          <option value="empty_edge_auto_calibrated.ply">empty_edge_auto_calibrated.ply</option>
          <option value="empty_edge_auto_calibrated_ground_rotated.ply">empty_edge_auto_calibrated_ground_rotated.ply</option>
          <option value="empty_edge_auto_calibrated_four_edge_rotated_zeroed.ply">empty_edge_auto_calibrated_four_edge_rotated_zeroed.ply</option>
          <option value="empty_xy_ground_flipped.ply">empty_xy_ground_flipped.ply</option>
        </select>
      </label>

      <label>
        預覽抽樣：<span id="sampleText">25%</span>
        <input id="sampleRate" type="range" min="1" max="100" value="25" />
      </label>

      <label>
        點大小：<span id="pointText">0.75</span>
        <input id="pointSize" type="range" min="0.1" max="4" step="0.05" value="0.75" />
      </label>
    </div>

    <div class="group row">
      <button id="loadBtn">載入</button>
      <button id="autoLevelBtn">自動水平</button>
    </div>

    <div class="group row">
      <button id="addXEdgeBtn">加入 X 邊點</button>
      <button id="addYEdgeBtn">加入 Y 邊點</button>
    </div>

    <div class="group row">
      <button id="edgeCalBtn">套用邊緣校正</button>
      <button id="clearEdgeBtn">清除邊點</button>
    </div>

    <div class="group">
      <label>
        X 旋轉：<span id="rotXText">0.000 deg</span>
        <input id="rotX" type="range" min="-30" max="30" step="0.001" value="0" />
      </label>
      <label>
        Y 旋轉：<span id="rotYText">0.000 deg</span>
        <input id="rotY" type="range" min="-30" max="30" step="0.001" value="0" />
      </label>
      <label>
        Z 旋轉：<span id="rotZText">0.000 deg</span>
        <input id="rotZ" type="range" min="-180" max="180" step="0.001" value="0" />
      </label>
      <label>
        Z 平移：<span id="zText">0.000 mm</span>
        <input id="zOffset" type="range" min="-120" max="120" step="0.001" value="0" />
      </label>
    </div>

    <div class="group triple">
      <button id="snapXBtn">X 歸零</button>
      <button id="snapYBtn">Y 歸零</button>
      <button id="snapZBtn">Z 歸零</button>
    </div>

    <div class="group checks">
      <label><input id="showGrid" type="checkbox" checked /> 基準網格</label>
      <label><input id="showGuides" type="checkbox" checked /> 輔助線</label>
    </div>

    <div class="group row">
      <button id="resetBtn">重設視角</button>
      <button id="saveBtn" disabled>儲存 PLY</button>
    </div>

    <div class="stat coord" id="coordReadout">
      <span>檔案</span><b>-</b>
      <span>X</span><b>-</b>
      <span>Y</span><b>-</b>
      <span>Z</span><b>-</b>
      <span>Intensity</span><b>-</b>
    </div>

    <div class="stat" id="edgeStatus">X 邊點：0　Y 邊點：0</div>

    <div class="stat" id="status">載入後旋轉點雲，讓地板貼齊 Z=0 網格。</div>
    <div class="bar"><div id="progress"></div></div>
  </section>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.querySelector("#viewer");
    const statusEl = document.querySelector("#status");
    const progressEl = document.querySelector("#progress");
    const edgeStatus = document.querySelector("#edgeStatus");
    const coordReadout = document.querySelector("#coordReadout");
    const fileSelect = document.querySelector("#fileSelect");
    const sampleRate = document.querySelector("#sampleRate");
    const sampleText = document.querySelector("#sampleText");
    const pointSize = document.querySelector("#pointSize");
    const pointText = document.querySelector("#pointText");
    const rotX = document.querySelector("#rotX");
    const rotY = document.querySelector("#rotY");
    const rotZ = document.querySelector("#rotZ");
    const zOffset = document.querySelector("#zOffset");
    const rotXText = document.querySelector("#rotXText");
    const rotYText = document.querySelector("#rotYText");
    const rotZText = document.querySelector("#rotZText");
    const zText = document.querySelector("#zText");
    const saveBtn = document.querySelector("#saveBtn");
    const showGrid = document.querySelector("#showGrid");
    const showGuides = document.querySelector("#showGuides");

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x101114, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 100000);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const cloudGroup = new THREE.Group();
    scene.add(cloudGroup);

    const grid = new THREE.GridHelper(1400, 28, 0xffffff, 0x35404a);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    const guideMaterialX = new THREE.LineBasicMaterial({ color: 0x46d6a7 });
    const guideMaterialY = new THREE.LineBasicMaterial({ color: 0xf2c14e });
    const xGuide = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-700, 0, 0), new THREE.Vector3(700, 0, 0)]),
      guideMaterialX
    );
    const yGuide = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -700, 0), new THREE.Vector3(0, 700, 0)]),
      guideMaterialY
    );
    scene.add(xGuide, yGuide);

    const axes = new THREE.AxesHelper(140);
    scene.add(axes);

    const raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 2.5;
    const pointer = new THREE.Vector2(2, 2);
    const pickedLocal = new THREE.Vector3();
    const pickedWorld = new THREE.Vector3();
    let pointerDirty = false;

    const pickMarker = new THREE.Mesh(
      new THREE.SphereGeometry(2.4, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false })
    );
    pickMarker.visible = false;
    pickMarker.renderOrder = 10;
    scene.add(pickMarker);

    let pointsObject = null;
    let material = null;
    let source = null;
    let lastPickedRaw = null;
    let edgeCalibration = null;
    const xEdgePoints = [];
    const yEdgePoints = [];
    const edgeMarkers = new THREE.Group();
    scene.add(edgeMarkers);

    const palette = [
      new THREE.Color("#243b6b"),
      new THREE.Color("#00a7a5"),
      new THREE.Color("#e5d65c"),
      new THREE.Color("#f26f4c")
    ];

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setProgress(value) {
      progressEl.style.width = `${Math.max(0, Math.min(100, value))}%`;
    }

    function setCoordReadout(data = null) {
      if (!data) {
        coordReadout.innerHTML = `
          <span>檔案</span><b>-</b>
          <span>X</span><b>-</b>
          <span>Y</span><b>-</b>
          <span>Z</span><b>-</b>
          <span>Intensity</span><b>-</b>
        `;
        return;
      }

      coordReadout.innerHTML = `
        <span>檔案</span><b>${data.name}</b>
        <span>X</span><b>${data.x.toFixed(3)} mm</b>
        <span>Y</span><b>${data.y.toFixed(3)} mm</b>
        <span>Z</span><b>${data.z.toFixed(3)} mm</b>
        <span>Intensity</span><b>${data.intensity.toFixed(0)}</b>
      `;
    }

    function updateEdgeStatus(extra = "") {
      edgeStatus.textContent = `X 邊點：${xEdgePoints.length}　Y 邊點：${yEdgePoints.length}${extra ? "\n" + extra : ""}`;
    }

    function addEdgeMarker(point, color) {
      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(3.2, 14, 14),
        new THREE.MeshBasicMaterial({ color, depthTest: false })
      );
      marker.position.copy(point);
      marker.renderOrder = 11;
      edgeMarkers.add(marker);
    }

    function clearEdgePoints() {
      xEdgePoints.length = 0;
      yEdgePoints.length = 0;
      edgeCalibration = null;
      while (edgeMarkers.children.length) {
        const marker = edgeMarkers.children.pop();
        marker.geometry.dispose();
        marker.material.dispose();
      }
      updateEdgeStatus();
    }

    function addCurrentPointToEdge(edgeName) {
      if (!lastPickedRaw) {
        setStatus("先把滑鼠移到邊緣點上，白色標記出現後再加入邊點。");
        return;
      }

      const point = lastPickedRaw.clone();
      if (edgeName === "x") {
        xEdgePoints.push(point);
        addEdgeMarker(edgeCalibration ? transformByEdgeBasis(point) : point, 0x46d6a7);
      } else {
        yEdgePoints.push(point);
        addEdgeMarker(edgeCalibration ? transformByEdgeBasis(point) : point, 0xf2c14e);
      }
      updateEdgeStatus();
    }

    function colorFromIntensity(intensity) {
      const t = Math.max(0, Math.min(1, intensity / 255));
      const scaled = t * (palette.length - 1);
      const i = Math.min(palette.length - 2, Math.floor(scaled));
      return palette[i].clone().lerp(palette[i + 1], scaled - i);
    }

    async function fetchTextWithProgress(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${url} 載入失敗：HTTP ${response.status}`);

      const total = Number(response.headers.get("content-length")) || 0;
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let received = 0;
      let text = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.byteLength;
        text += decoder.decode(value, { stream: true });
        if (total) setProgress((received / total) * 45);
      }

      text += decoder.decode();
      return text;
    }

    function parsePly(text, samplePercent) {
      const headerEnd = text.indexOf("end_header");
      if (headerEnd < 0) throw new Error("找不到 PLY end_header。");

      const headerLineEnd = text.indexOf("\n", headerEnd);
      const header = text.slice(0, headerLineEnd + 1);
      const vertexMatch = header.match(/element\s+vertex\s+(\d+)/);
      const declaredCount = vertexMatch ? Number(vertexMatch[1]) : 0;
      const body = text.slice(headerLineEnd + 1);
      const lines = body.split(/\r?\n/);
      const total = lines.filter(Boolean).length;
      const step = Math.max(1, Math.round(100 / samplePercent));

      const positions = new Float32Array(total * 3);
      const intensities = new Uint8Array(total);
      const previewPositions = new Float32Array(Math.ceil(total / step) * 3);
      const previewColors = new Float32Array(Math.ceil(total / step) * 3);
      const previewIntensity = new Float32Array(Math.ceil(total / step));
      const box = new THREE.Box3();
      const point = new THREE.Vector3();
      let count = 0;
      let previewCount = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (!line) continue;
        const parts = line.split(" ");
        if (parts.length < 3) continue;

        const x = Number(parts[0]);
        const y = Number(parts[1]);
        const z = Number(parts[2]);
        const intensity = parts.length > 3 ? Number(parts[3]) : 180;
        if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;

        const offset = count * 3;
        positions[offset] = x;
        positions[offset + 1] = y;
        positions[offset + 2] = z;
        intensities[count] = Math.max(0, Math.min(255, intensity));

        point.set(x, y, z);
        box.expandByPoint(point);

        if (count % step === 0) {
          const previewOffset = previewCount * 3;
          previewPositions[previewOffset] = x;
          previewPositions[previewOffset + 1] = y;
          previewPositions[previewOffset + 2] = z;

          const color = colorFromIntensity(intensity);
          previewColors[previewOffset] = color.r;
          previewColors[previewOffset + 1] = color.g;
          previewColors[previewOffset + 2] = color.b;
          previewIntensity[previewCount] = intensity;
          previewCount++;
        }

        count++;
        if (i % 120000 === 0) setProgress(45 + (i / lines.length) * 45);
      }

      return {
        header,
        declaredCount,
        count,
        positions: positions.slice(0, count * 3),
        intensities: intensities.slice(0, count),
        previewPositions: previewPositions.slice(0, previewCount * 3),
        previewColors: previewColors.slice(0, previewCount * 3),
        previewIntensity: previewIntensity.slice(0, previewCount),
        box
      };
    }

    function clearCloud() {
      if (pointsObject) {
        cloudGroup.remove(pointsObject);
        pointsObject.geometry.dispose();
        pointsObject = null;
      }
      if (material) {
        material.dispose();
        material = null;
      }
      source = null;
      lastPickedRaw = null;
      clearEdgePoints();
      saveBtn.disabled = true;
      pickMarker.visible = false;
      setCoordReadout();
    }

    function applyTransformControls() {
      const rx = THREE.MathUtils.degToRad(Number(rotX.value));
      const ry = THREE.MathUtils.degToRad(Number(rotY.value));
      const rz = THREE.MathUtils.degToRad(Number(rotZ.value));
      cloudGroup.rotation.set(rx, ry, rz, "XYZ");
      if (source && edgeCalibration) {
        cloudGroup.position.set(0, 0, Number(zOffset.value));
      } else if (source) {
        cloudGroup.position.set(source.center.x, source.center.y, source.center.z + Number(zOffset.value));
      } else {
        cloudGroup.position.z = Number(zOffset.value);
      }

      rotXText.textContent = `${Number(rotX.value).toFixed(3)} deg`;
      rotYText.textContent = `${Number(rotY.value).toFixed(3)} deg`;
      rotZText.textContent = `${Number(rotZ.value).toFixed(3)} deg`;
      zText.textContent = `${Number(zOffset.value).toFixed(3)} mm`;

      const nearX = Math.abs(Number(rotX.value)) < 0.05;
      const nearY = Math.abs(Number(rotY.value)) < 0.05;
      xGuide.material.color.set(nearY ? 0x78ffbf : 0x46d6a7);
      yGuide.material.color.set(nearX ? 0xffdf6b : 0xf2c14e);
      pointerDirty = true;
    }

    function setRotationFromEuler(euler) {
      rotX.value = THREE.MathUtils.radToDeg(euler.x).toFixed(3);
      rotY.value = THREE.MathUtils.radToDeg(euler.y).toFixed(3);
      rotZ.value = THREE.MathUtils.radToDeg(euler.z).toFixed(3);
      applyTransformControls();
    }

    function fitCamera() {
      if (edgeCalibration) {
        fitCameraToObject();
        return;
      }
      if (!source) return;
      const box = source.box.clone();
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxSize = Math.max(size.x, size.y, size.z);
      const distance = maxSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));

      controls.target.copy(center);
      camera.position.set(center.x + distance * 0.75, center.y - distance * 1.15, center.z + distance * 0.7);
      camera.near = Math.max(0.01, distance / 500);
      camera.far = Math.max(10000, distance * 8);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function fitCameraToObject() {
      if (!pointsObject) return;
      const box = new THREE.Box3().setFromObject(pointsObject);
      if (box.isEmpty()) return;

      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxSize = Math.max(size.x, size.y, size.z);
      const distance = maxSize / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));

      controls.target.copy(center);
      camera.position.set(center.x + distance * 0.75, center.y - distance * 1.15, center.z + distance * 0.7);
      camera.near = Math.max(0.01, distance / 500);
      camera.far = Math.max(10000, distance * 8);
      camera.updateProjectionMatrix();
      controls.update();
    }

    async function loadSelected() {
      clearCloud();
      setProgress(0);
      document.querySelector("#loadBtn").disabled = true;
      saveBtn.disabled = true;

      try {
        const name = fileSelect.value;
        setStatus(`正在載入 ${name}...`);
        const text = await fetchTextWithProgress(name);
        setStatus(`正在解析 ${name}...`);
        await new Promise(requestAnimationFrame);

        const parsed = parsePly(text, Number(sampleRate.value));
        const center = parsed.box.getCenter(new THREE.Vector3());
        const localPreview = new Float32Array(parsed.previewPositions.length);
        const rawPreview = new Float32Array(parsed.previewPositions.length);
        for (let i = 0; i < parsed.previewPositions.length; i += 3) {
          rawPreview[i] = parsed.previewPositions[i];
          rawPreview[i + 1] = parsed.previewPositions[i + 1];
          rawPreview[i + 2] = parsed.previewPositions[i + 2];
          localPreview[i] = parsed.previewPositions[i] - center.x;
          localPreview[i + 1] = parsed.previewPositions[i + 1] - center.y;
          localPreview[i + 2] = parsed.previewPositions[i + 2] - center.z;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(localPreview, 3));
        geometry.setAttribute("rawPosition", new THREE.BufferAttribute(rawPreview, 3));
        geometry.setAttribute("color", new THREE.BufferAttribute(parsed.previewColors, 3));
        geometry.setAttribute("intensity", new THREE.BufferAttribute(parsed.previewIntensity, 1));
        geometry.computeBoundingSphere();

        material = new THREE.PointsMaterial({
          size: Number(pointSize.value),
          sizeAttenuation: false,
          vertexColors: true
        });

        pointsObject = new THREE.Points(geometry, material);
        cloudGroup.position.set(center.x, center.y, center.z + Number(zOffset.value));
        cloudGroup.rotation.set(0, 0, 0);
        cloudGroup.add(pointsObject);
        source = { ...parsed, name, center };
        saveBtn.disabled = false;

        rotX.value = 0;
        rotY.value = 0;
        rotZ.value = 0;
        zOffset.value = 0;
        applyTransformControls();
        fitCamera();
        setProgress(100);
        setStatus(`${name} 載入完成\n預覽點數：${parsed.previewIntensity.length.toLocaleString()} / ${parsed.count.toLocaleString()}\n旋轉後可按「儲存 PLY」輸出。`);
      } catch (error) {
        console.error(error);
        setStatus(`發生錯誤：${error.message}`);
      } finally {
        document.querySelector("#loadBtn").disabled = false;
      }
    }

    function solve3(matrix, vector) {
      const rows = matrix.map((row, i) => [...row, vector[i]]);
      for (let pivot = 0; pivot < 3; pivot++) {
        let best = pivot;
        for (let row = pivot + 1; row < 3; row++) {
          if (Math.abs(rows[row][pivot]) > Math.abs(rows[best][pivot])) best = row;
        }
        if (Math.abs(rows[best][pivot]) < 1e-12) throw new Error("平面計算失敗，請改用手動旋轉。");
        [rows[pivot], rows[best]] = [rows[best], rows[pivot]];
        const divisor = rows[pivot][pivot];
        for (let col = pivot; col < 4; col++) rows[pivot][col] /= divisor;
        for (let row = 0; row < 3; row++) {
          if (row === pivot) continue;
          const factor = rows[row][pivot];
          for (let col = pivot; col < 4; col++) rows[row][col] -= factor * rows[pivot][col];
        }
      }
      return [rows[0][3], rows[1][3], rows[2][3]];
    }

    function fitPlane(points) {
      let sx = 0, sy = 0, sz = 0, sxx = 0, syy = 0, sxy = 0, sxz = 0, syz = 0;
      for (const p of points) {
        const x = p[0], y = p[1], z = p[2];
        sx += x; sy += y; sz += z;
        sxx += x * x; syy += y * y; sxy += x * y;
        sxz += x * z; syz += y * z;
      }
      return solve3(
        [[sxx, sxy, sx], [sxy, syy, sy], [sx, sy, points.length]],
        [sxz, syz, sz]
      );
    }

    function fitLine(points) {
      const centroid = new THREE.Vector3();
      for (const point of points) centroid.add(point);
      centroid.multiplyScalar(1 / points.length);

      let xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
      for (const point of points) {
        const x = point.x - centroid.x;
        const y = point.y - centroid.y;
        const z = point.z - centroid.z;
        xx += x * x; xy += x * y; xz += x * z;
        yy += y * y; yz += y * z; zz += z * z;
      }

      let direction = new THREE.Vector3(1, 0, 0);
      for (let i = 0; i < 24; i++) {
        direction.set(
          xx * direction.x + xy * direction.y + xz * direction.z,
          xy * direction.x + yy * direction.y + yz * direction.z,
          xz * direction.x + yz * direction.y + zz * direction.z
        ).normalize();
      }

      return { centroid, direction };
    }

    function closestOrigin(lineA, lineB) {
      const p13 = lineA.centroid.clone().sub(lineB.centroid);
      const d1 = lineA.direction;
      const d2 = lineB.direction;
      const d1343 = p13.dot(d2);
      const d4321 = d2.dot(d1);
      const d1321 = p13.dot(d1);
      const d4343 = d2.dot(d2);
      const d2121 = d1.dot(d1);
      const denominator = d2121 * d4343 - d4321 * d4321;

      if (Math.abs(denominator) < 1e-9) {
        return lineA.centroid.clone().add(lineB.centroid).multiplyScalar(0.5);
      }

      const numerator = d1343 * d4321 - d1321 * d4343;
      const mua = numerator / denominator;
      const mub = (d1343 + d4321 * mua) / d4343;
      const pointA = lineA.centroid.clone().addScaledVector(d1, mua);
      const pointB = lineB.centroid.clone().addScaledVector(d2, mub);
      return pointA.add(pointB).multiplyScalar(0.5);
    }

    function averagePoint(points) {
      const point = new THREE.Vector3();
      for (const item of points) point.add(item);
      return point.multiplyScalar(1 / points.length);
    }

    function makeEdgeCalibration() {
      if (xEdgePoints.length < 2 || yEdgePoints.length < 2) {
        throw new Error("X 邊與 Y 邊都至少需要 2 個點。");
      }

      const xLine = fitLine(xEdgePoints);
      const yLine = fitLine(yEdgePoints);
      const origin = closestOrigin(xLine, yLine);
      const avgX = averagePoint(xEdgePoints);
      const avgY = averagePoint(yEdgePoints);

      let xAxis = xLine.direction.clone().normalize();
      if (avgX.clone().sub(origin).dot(xAxis) < 0) xAxis.negate();

      let yAxis = yLine.direction.clone().normalize();
      if (avgY.clone().sub(origin).dot(yAxis) < 0) yAxis.negate();

      yAxis.addScaledVector(xAxis, -yAxis.dot(xAxis)).normalize();
      let zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis).normalize();
      yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();

      if (zAxis.z < 0) {
        zAxis.negate();
        yAxis.negate();
      }

      return { origin, xAxis, yAxis, zAxis };
    }

    function transformByEdgeBasis(point, calibration = edgeCalibration) {
      const relative = point.clone().sub(calibration.origin);
      return new THREE.Vector3(
        relative.dot(calibration.xAxis),
        relative.dot(calibration.yAxis),
        relative.dot(calibration.zAxis)
      );
    }

    function applyEdgeCalibration() {
      if (!source || !pointsObject) return;

      try {
        edgeCalibration = makeEdgeCalibration();
        const position = pointsObject.geometry.getAttribute("position");
        const raw = pointsObject.geometry.getAttribute("rawPosition");
        const rawPoint = new THREE.Vector3();

        for (let i = 0; i < position.count; i++) {
          rawPoint.fromBufferAttribute(raw, i);
          const transformed = transformByEdgeBasis(rawPoint);
          position.setXYZ(i, transformed.x, transformed.y, transformed.z);
        }

        position.needsUpdate = true;
        pointsObject.geometry.computeBoundingSphere();
        cloudGroup.position.set(0, 0, 0);
        cloudGroup.rotation.set(0, 0, 0);
        rotX.value = 0;
        rotY.value = 0;
        rotZ.value = 0;
        zOffset.value = 0;
        applyTransformControls();

        while (edgeMarkers.children.length) {
          const marker = edgeMarkers.children.pop();
          marker.geometry.dispose();
          marker.material.dispose();
        }
        for (const point of xEdgePoints) addEdgeMarker(transformByEdgeBasis(point), 0x46d6a7);
        for (const point of yEdgePoints) addEdgeMarker(transformByEdgeBasis(point), 0xf2c14e);

        const origin = edgeCalibration.origin;
        updateEdgeStatus(`已套用邊緣校正\n原點：X=${origin.x.toFixed(3)}, Y=${origin.y.toFixed(3)}, Z=${origin.z.toFixed(3)}`);
        setStatus("邊緣校正已套用。X 邊會落在 y=0 / z=0，Y 邊會落在 x=0 / z=0。確認後可儲存 PLY。");
        fitCameraToObject();
      } catch (error) {
        console.error(error);
        setStatus(`邊緣校正失敗：${error.message}`);
      }
    }

    function autoLevel() {
      if (!source) return;

      const positions = source.positions;
      const step = Math.max(1, Math.floor(source.count / 180000));
      let candidates = [];
      for (let i = 0; i < source.count; i += step) {
        const offset = i * 3;
        candidates.push([positions[offset], positions[offset + 1], positions[offset + 2]]);
      }

      let plane = fitPlane(candidates);
      for (let pass = 0; pass < 4; pass++) {
        const [a, b, c] = plane;
        candidates = candidates
          .map((p) => [Math.abs(p[2] - (a * p[0] + b * p[1] + c)), p])
          .sort((left, right) => left[0] - right[0])
          .slice(0, Math.max(3, Math.floor(candidates.length * 0.5)))
          .map((item) => item[1]);
        plane = fitPlane(candidates);
      }

      const [a, b, c] = plane;
      const normal = new THREE.Vector3(-a, -b, 1).normalize();
      const target = new THREE.Vector3(0, 0, 1);
      const quaternion = new THREE.Quaternion().setFromUnitVectors(normal, target);
      const euler = new THREE.Euler().setFromQuaternion(quaternion, "XYZ");
      setRotationFromEuler(euler);

      const center = source.center;
      const planeZAtCenter = a * center.x + b * center.y + c;
      const planePointAtCenter = new THREE.Vector3(0, 0, planeZAtCenter - center.z).applyQuaternion(quaternion);
      zOffset.value = (-(center.z + planePointAtCenter.z)).toFixed(3);
      applyTransformControls();
      setStatus(`自動水平完成\nfit 平面：z = ${a.toFixed(9)}*x + ${b.toFixed(9)}*y + ${c.toFixed(6)}\n可再微調旋轉後儲存。`);
    }

    function transformedPoint(index, matrix) {
      const offset = index * 3;
      const raw = new THREE.Vector3(
        source.positions[offset],
        source.positions[offset + 1],
        source.positions[offset + 2]
      );
      const p = edgeCalibration
        ? transformByEdgeBasis(raw)
        : raw.sub(source.center);
      p.applyMatrix4(matrix);
      return p;
    }

    async function savePly() {
      if (!source) return;
      saveBtn.disabled = true;
      setStatus("正在產生旋轉後 PLY...");
      try {
        await new Promise(requestAnimationFrame);

        cloudGroup.updateMatrixWorld(true);
        const matrix = cloudGroup.matrixWorld.clone();
        const header = source.header.replace(
          "end_header",
          `comment transformed in align_editor.html: mode=${edgeCalibration ? "edge" : "manual"} rx=${Number(rotX.value).toFixed(6)}deg ry=${Number(rotY.value).toFixed(6)}deg rz=${Number(rotZ.value).toFixed(6)}deg z_offset=${Number(zOffset.value).toFixed(6)}mm\nend_header`
        );
        const chunks = [header];

        for (let i = 0; i < source.count; i++) {
          const p = transformedPoint(i, matrix);
          chunks.push(`${p.x.toFixed(6)} ${p.y.toFixed(6)} ${p.z.toFixed(6)} ${source.intensities[i]}\n`);
          if (i > 0 && i % 200000 === 0) {
            setProgress((i / source.count) * 100);
            await new Promise(requestAnimationFrame);
          }
        }

        const blob = new Blob(chunks, { type: "application/octet-stream" });
        const suffix = `rx${Number(rotX.value).toFixed(3)}_ry${Number(rotY.value).toFixed(3)}_rz${Number(rotZ.value).toFixed(3)}`.replaceAll("-", "m").replaceAll(".", "p");
        const fileName = source.name.replace(/\.ply$/i, `_rotated_${suffix}.ply`);

        if ("showSaveFilePicker" in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: fileName,
            types: [{ description: "PLY point cloud", accept: { "application/octet-stream": [".ply"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
        } else {
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = fileName;
          link.click();
          URL.revokeObjectURL(link.href);
        }

        setProgress(100);
        setStatus(`已儲存：${fileName}`);
      } catch (error) {
        if (error.name === "AbortError") {
          setStatus("已取消儲存。");
        } else {
          console.error(error);
          setStatus(`儲存失敗：${error.message}`);
        }
      } finally {
        saveBtn.disabled = false;
      }
    }

    function pickPoint() {
      if (!pointsObject) return;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(pointsObject, false);
      if (!hits.length || hits[0].index === undefined) {
        pickMarker.visible = false;
        setCoordReadout();
        return;
      }

      const hit = hits[0];
      const position = pointsObject.geometry.getAttribute("position");
      const rawPosition = pointsObject.geometry.getAttribute("rawPosition");
      const intensity = pointsObject.geometry.getAttribute("intensity");
      pickedLocal.fromBufferAttribute(position, hit.index);
      pickedWorld.copy(pickedLocal).applyMatrix4(pointsObject.matrixWorld);
      lastPickedRaw = new THREE.Vector3().fromBufferAttribute(rawPosition, hit.index);
      pickMarker.position.copy(pickedWorld);
      pickMarker.visible = true;

      setCoordReadout({
        name: source.name,
        x: pickedWorld.x,
        y: pickedWorld.y,
        z: pickedWorld.z,
        intensity: intensity ? intensity.getX(hit.index) : 0
      });
    }

    sampleRate.addEventListener("input", () => {
      sampleText.textContent = `${sampleRate.value}%`;
    });

    pointSize.addEventListener("input", () => {
      pointText.textContent = Number(pointSize.value).toFixed(2);
      if (material) material.size = Number(pointSize.value);
    });

    for (const input of [rotX, rotY, rotZ, zOffset]) {
      input.addEventListener("input", applyTransformControls);
    }

    document.querySelector("#snapXBtn").addEventListener("click", () => { rotX.value = 0; applyTransformControls(); });
    document.querySelector("#snapYBtn").addEventListener("click", () => { rotY.value = 0; applyTransformControls(); });
    document.querySelector("#snapZBtn").addEventListener("click", () => { rotZ.value = 0; applyTransformControls(); });
    document.querySelector("#loadBtn").addEventListener("click", loadSelected);
    document.querySelector("#autoLevelBtn").addEventListener("click", autoLevel);
    document.querySelector("#addXEdgeBtn").addEventListener("click", () => addCurrentPointToEdge("x"));
    document.querySelector("#addYEdgeBtn").addEventListener("click", () => addCurrentPointToEdge("y"));
    document.querySelector("#edgeCalBtn").addEventListener("click", applyEdgeCalibration);
    document.querySelector("#clearEdgeBtn").addEventListener("click", clearEdgePoints);
    document.querySelector("#resetBtn").addEventListener("click", fitCamera);
    saveBtn.addEventListener("click", savePly);

    showGrid.addEventListener("change", () => {
      grid.visible = showGrid.checked;
      axes.visible = showGrid.checked;
    });

    showGuides.addEventListener("change", () => {
      const visible = showGuides.checked;
      xGuide.visible = visible;
      yGuide.visible = visible;
      document.querySelector(".screen-guide.h").style.display = visible ? "block" : "none";
      document.querySelector(".screen-guide.v").style.display = visible ? "block" : "none";
    });

    canvas.addEventListener("pointermove", (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      pointerDirty = true;
    });

    canvas.addEventListener("pointerleave", () => {
      pointer.set(2, 2);
      pointerDirty = false;
      lastPickedRaw = null;
      pickMarker.visible = false;
      setCoordReadout();
    });

    window.addEventListener("resize", resize);
    resize();

    renderer.setAnimationLoop(() => {
      if (pointerDirty) {
        pickPoint();
        pointerDirty = false;
      }
      controls.update();
      renderer.render(scene, camera);
    });

    loadSelected();
  </script>
</body>
</html>
